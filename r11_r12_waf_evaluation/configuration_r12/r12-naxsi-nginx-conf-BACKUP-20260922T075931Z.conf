load_module /usr/lib/nginx/modules/ngx_http_naxsi_module.so;

user www-data;
worker_processes auto;
pid /run/comp6016-naxsi.pid;
error_log /var/log/nginx/comp6016_naxsi_error.log notice;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format comp6016
        '$time_iso8601 client=$remote_addr '
        'test_id="$http_x_waf_test_id" '
        'naxsi_id="$naxsi_request_id" '
        'request="$request" status=$status '
        'bytes=$body_bytes_sent time=$request_time';

    access_log /var/log/nginx/comp6016_naxsi_access.log comp6016;

    include /etc/comp6016-naxsi/naxsi_core.rules;

    upstream comp6016_dvwa_backend {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 0.0.0.0:8084;
        server_name waf-lab.local;

        set $naxsi_json_log 1;
        set $naxsi_extensive_log 1;

        location = /RequestDenied {
            return 403;
        }

        location / {
            SecRulesEnabled;
            DeniedUrl "/RequestDenied";

            CheckRule "$SQL >= 8" BLOCK;
            CheckRule "$RFI >= 8" BLOCK;
            CheckRule "$TRAVERSAL >= 4" BLOCK;
            CheckRule "$EVADE >= 4" BLOCK;
            CheckRule "$XSS >= 8" BLOCK;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://comp6016_dvwa_backend;
        }
    }
}
